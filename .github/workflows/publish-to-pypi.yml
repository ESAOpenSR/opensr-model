name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-and-publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build
    - name: Build and validate distributions
      run: |
        test "$GITHUB_REF_NAME" = "v$(python setup.py --version)"
        python -m build
        python -m twine check --strict dist/*
        (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
    - name: Preserve release distributions
      uses: actions/upload-artifact@v4
      with:
        name: python-distributions
        path: dist/
        if-no-files-found: error
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload --non-interactive dist/*.whl dist/*.tar.gz
    - name: Attach distributions and checksums to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
