minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

# Use the active development environment, including its PyTorch installation.
repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: python -m black --check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pytest
        name: Tests with coverage
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
