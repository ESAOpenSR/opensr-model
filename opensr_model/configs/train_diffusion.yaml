# Independent stage-2 denoiser training with a frozen first-stage autoencoder.
stage: diffusion
seed: 42
float32_matmul_precision: high
run_dir: training_runs/diffusion
resume_checkpoint: null  # only a resume/*.ckpt produced by this pipeline

model:
  architecture_config: config_10m.yaml
  # Full released/native checkpoint for denoiser fine-tuning (loads schedule + EMA).
  pretrained_checkpoint: null
  # Optional standalone stage-1 output; overrides the AE inside a full checkpoint.
  autoencoder_checkpoint: null
  allow_random_first_stage: false

data:
  # A directory of completed .tortilla parts, one .tortilla, or a list of either.
  taco_path: /work/data/SISR_worldwide
  # Asset IDs in the legacy TACO v1 samples. RGB is already stored in RGB order.
  lr_asset_id: lrharm
  hr_asset_id: hrharm
  raw_lr_asset_id: lr
  rgb_bands: [1, 2, 3]  # one-based
  nir_band: 8           # one-based B8 in the raw 12-band Sentinel-2 asset
  # Required synthetic 512px NIR target, keyed by the outer TACO sample ID and
  # histogram-matched to bilinearly upsampled native LR B8 in the loader.
  hr_nir_strategy: synthetic_sidecar
  synthetic_hr_nir_dir: /work/data/SISR_worldwide/synth_nirs
  reflectance_scale: 0.0001  # uint16 reflectance DN -> [0, 1]
  val_fraction: 0.1
  split_seed: ${seed}
  factor: 4
  train_patch_size: 512
  # Null preserves complete-image validation; set for deterministic center crops.
  validation_patch_size: null
  value_range: [0.0, 1.0]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotate_90: true
  # Measured safe per-GPU setting for two 24 GiB RTX 3090s at 512 -> 128.
  batch_size: 4
  val_batch_size: 1
  # Deliberately resample the small validation subset every epoch.
  val_shuffle: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

training:
  optimizer:
    learning_rate: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0
  # One quality-oriented objective: P2-weighted epsilon prediction plus
  # low-noise detail losses. Decoded RGB supervision is intentionally sparse
  # because backpropagating through the frozen 512px decoder is expensive.
  sharpness:
    p2_gamma: 1.0
    p2_k: 1.0
    latent_detail_weight: 0.05
    latent_detail_max_timestep_fraction: 0.25
    decoded_reconstruction_weight: 0.1
    decoded_detail_weight: 0.1
    decoded_perceptual_weight: 0.1
    decoded_max_timestep_fraction: 0.20
    decoded_every_n_batches: 8
    decoded_max_batch_size: 1
    # L1 and Laplacian decoded supervision cover RGB+NIR jointly. LPIPS remains
    # RGB-only because its pretrained VGG backbone accepts three channels.
    decoded_rgb_only: false
    perceptual_backbone: vgg
  scheduler:
    name: plateau  # plateau or constant
    factor: 0.5
    patience: 10
    min_lr: 0.000001
  validation:
    # The validation loader is capped at 25 batches below. Generate a complete
    # 512px DDIM reconstruction for exactly the first five shuffled batches.
    num_samples: 1
    image_batches: 5
    every_n_epochs: 1
    sampling_steps: 100
    sampling_eta: 0.95  # deliberately stochastic for perceptually richer samples
    temperature: 1.0
    seed: ${seed}
    use_ema: true
    # Reproducible aligned detail: 64x64 HR pixels and the matching 16x16 LR area.
    detail_crop_size: 64

trainer:
  accelerator: auto
  devices: auto
  strategy: auto
  precision: 16-mixed
  max_epochs: 1000
  # Two GPUs give effective global batch 8; no extra accumulation is needed.
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  # Validate at 20%, 40%, 60%, 80%, and approximately 100% of every epoch.
  val_check_interval: 0.2
  limit_val_batches: 25
  # Preview five complete shuffled validation tiles in W&B before training.
  # Lightning discards sanity metrics before model selection and scheduling.
  num_sanity_val_steps: 5
  deterministic: false
  enable_checkpointing: true

checkpoint:
  # Select by decoded EMA super-resolution quality instead of denoising loss.
  monitor: val/sr_ema_psnr
  mode: max
  resume_dir: checkpoints/resume
  save_top_k: 1
  save_last: true
  every_n_epochs: 1
  rolling:
    enabled: true
    # Keep the newest complete resume checkpoint written every 10k optimizer steps.
    dir: checkpoints/rolling
    every_n_train_steps: 10000
    save_top_k: 1
  native:
    enabled: true
    dir: checkpoints/native
    save_best: true
    save_last: true
    every_n_epochs: 1
    # Inference executes model.* directly, so materialize the EMA shadow values
    # into those keys while retaining the complete native state-dict contract.
    weight_source: ema
    autoencoder_base_checkpoint: null
  early_stopping:
    enabled: false
    patience: 30
    min_delta: 0.0

logging:
  type: wandb
  save_dir: logs
  name: diffusion
  version: null
  project: opensr-training
  log_model: false
  cost:
    enabled: true
    electricity_eur_per_kwh: 0.30
    # Ryzen 7600X host + board/RAM/storage + dual-GPU water loop + PSU losses.
    overhead_watts: 200
    every_n_steps: 20
  images:
    enabled: true
    output_dir: images
    max_images: 5
    every_n_epochs: 1
    rgb_bands: [0, 1, 2]
    nir_band: 3
    value_min: 0.0
    value_max: 0.3
